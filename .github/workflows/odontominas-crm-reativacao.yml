name: OdontoMinas CRM — reativação de paciente inativo

# Fase 5 do CRM (ver clientes/odontominas/andamento.md): dispara 1x/dia a
# automação de reativação (src/lib/reativacao.ts) via POST autenticado por
# segredo — o mesmo padrão do webhook da Evolution, sem sessão de painel.
# Precisa do secret ODONTOMINAS_CRM_CRON_SECRET (repo Settings > Secrets),
# igual ao CRON_SECRET setado no serviço Railway.

on:
  schedule:
    - cron: "0 12 * * *" # ~9h em Brasília (UTC-3)
  workflow_dispatch: {}

jobs:
  reativacao:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de reativação
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "x-cron-secret: ${{ secrets.ODONTOMINAS_CRM_CRON_SECRET }}" \
            https://odontominas-crm-production.up.railway.app/api/cron/reativacao
